name: Sync docs to Google Drive

# 每次 push 改动了 docs/ 或 README 时,自动把 docs/ 镜像同步到 Google Drive。
# 一次性配置见 docs/DRIVE_SYNC_SETUP.md(需你本人做一次 Google OAuth 授权 +
# 设置两个 GitHub secret/variable)。在配置完成前,本 workflow 会因缺少 secret
# 而失败/跳过——这不影响仓库其它任何东西。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch: {}   # 也可在 Actions 页手动触发一次

# 只保留最新一次同步,避免并发写 Drive
concurrency:
  group: sync-docs-to-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # 未配置 secret 时直接跳过,不报红
    if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config from secret
        run: |
          mkdir -p ~/.config/rclone
          # RCLONE_CONF = 本地 `rclone config` 生成的 rclone.conf 全文(含 OAuth token)
          printf '%s' "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf || { echo "RCLONE_CONF secret 为空"; exit 1; }

      - name: Sync docs/ → Drive 子文件夹 stock-agent-docs
        # sync 会让目标与 docs/ 完全一致(删掉多余文件),但**限定在专用子文件夹**
        # stock-agent-docs 内,绝不动你 Drive 文件夹里的其它文件。
        run: |
          rclone sync docs "gdrive:stock-agent-docs" \
            --drive-root-folder-id "${{ vars.GDRIVE_FOLDER_ID }}" \
            --create-empty-src-dirs \
            --verbose
